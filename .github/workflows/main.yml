name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # 检测哪些服务有代码变更（增量构建的核心）
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cms: ${{ steps.filter.outputs.cms }}
      view: ${{ steps.filter.outputs.view }}
      blog_api: ${{ steps.filter.outputs.blog_api }}
      agent_frontend: ${{ steps.filter.outputs.agent_frontend }}
      agent_backend: ${{ steps.filter.outputs.agent_backend }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要历史记录来对比变更

      # 手动触发时没有 before SHA 无法对比，跳过该步骤（手动触发默认全量构建）
      - name: Filter changed paths
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cms:
              - 'NBlog-master/blog-cms/**'
            view:
              - 'NBlog-master/blog-view/**'
            blog_api:
              - 'blog-api/**'
            agent_frontend:
              - 'NBlog-master/blog-agent/**'
            agent_backend:
              - 'blog-agent/**'
            mcp:
              - 'mcp-skill-service/**'

  build-cms:
    name: Build blog-cms (Vue)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cms == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog-cms
        working-directory: ./NBlog-master/blog-cms
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-dist
          path: NBlog-master/blog-cms/dist
          retention-days: 3

  build-view:
    name: Build blog-view (Vue)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.view == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog-view
        working-directory: ./NBlog-master/blog-view
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: view-dist
          path: NBlog-master/blog-view/dist
          retention-days: 3

  build-agent-frontend:
    name: Build blog-agent frontend (Vue)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog-agent frontend
        working-directory: ./NBlog-master/blog-agent
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-frontend-dist
          path: NBlog-master/blog-agent/dist
          retention-days: 3

  build-blog-api:
    name: Build blog-api (Java 8)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.blog_api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: ./blog-api
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: blog-api/target/*.jar
          retention-days: 3

  build-agent-backend:
    name: Build blog-agent backend (Java 17)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent_backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: ./blog-agent/agent
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blog-agent-jar
          path: blog-agent/agent/target/*.jar
          retention-days: 3

  build-mcp:
    name: Build MCP Skill Service (Java 17)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.mcp == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: ./mcp-skill-service
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-skill-service-jar
          path: mcp-skill-service/target/*.jar
          retention-days: 3

  deploy:
    name: Deploy to Server
    needs: [build-cms, build-view, build-agent-frontend, build-blog-api, build-agent-backend, build-mcp]
    runs-on: ubuntu-latest
    environment: host
    if: github.event_name == 'push' && !cancelled() && (needs.build-cms.result == 'success' || needs.build-view.result == 'success' || needs.build-agent-frontend.result == 'success' || needs.build-blog-api.result == 'success' || needs.build-agent-backend.result == 'success' || needs.build-mcp.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy blog-cms frontend
        if: needs.build-cms.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          DIST=$(find artifacts/cms-dist -type d -name dist -print -quit)
          DIST=${DIST:-artifacts/cms-dist}
          rsync -av --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$DIST/" \
            $SERVER_USER@$SERVER_HOST:/root/blog/frontend/cms/dist/

      - name: Deploy blog-view frontend
        if: needs.build-view.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          DIST=$(find artifacts/view-dist -type d -name dist -print -quit)
          DIST=${DIST:-artifacts/view-dist}
          rsync -av --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$DIST/" \
            $SERVER_USER@$SERVER_HOST:/root/blog/frontend/view/dist/

      - name: Deploy blog-agent frontend
        if: needs.build-agent-frontend.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          DIST=$(find artifacts/agent-frontend-dist -type d -name dist -print -quit)
          DIST=${DIST:-artifacts/agent-frontend-dist}
          rsync -av --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$DIST/" \
            $SERVER_USER@$SERVER_HOST:/root/blog/frontend/agent/dist/

      - name: Reload Nginx
        if: needs.build-cms.result == 'success' || needs.build-view.result == 'success' || needs.build-agent-frontend.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "docker exec blog-nginx nginx -s reload"

      - name: Deploy blog-api (Java)
        if: needs.build-blog-api.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          JAR=$(find artifacts/java-jar -name '*.jar' -print -quit)
          scp -o StrictHostKeyChecking=no "$JAR" $SERVER_USER@$SERVER_HOST:/root/blog/backend/java/blog-api-0.0.1.jar
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "docker restart blog-java"

      - name: Deploy blog-agent backend (Java)
        if: needs.build-agent-backend.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p /root/blog/backend/java/blog-agent"
          JAR=$(find artifacts/blog-agent-jar -name '*.jar' -print -quit)
          scp -o StrictHostKeyChecking=no "$JAR" $SERVER_USER@$SERVER_HOST:/root/blog/backend/java/blog-agent.0.0.1.jar
          scp -o StrictHostKeyChecking=no blog-agent/Dockerfile $SERVER_USER@$SERVER_HOST:/root/blog/backend/java/blog-agent/Dockerfile
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "docker restart blog-agent"

      - name: Deploy MCP Skill Service (Java)
        if: needs.build-mcp.result == 'success'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p /root/blog/backend/java/mcp-skill-service"
          JAR=$(find artifacts/mcp-skill-service-jar -name '*.jar' -print -quit)
          scp -o StrictHostKeyChecking=no "$JAR" $SERVER_USER@$SERVER_HOST:/root/blog/backend/java/mcp-skill-service.jar
          scp -o StrictHostKeyChecking=no mcp-skill-service/Dockerfile $SERVER_USER@$SERVER_HOST:/root/blog/backend/java/mcp-skill-service/Dockerfile
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "docker restart mcp-skill-service"
